name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # PR ではビルドとテストの確認だけ（Release は main に入った時だけ公開する）
      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/jarvis-v0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: jarvis-apk
          path: out/*.apk

      - name: Publish release (スマホからダウンロードする場所)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: ジャービス v0.1.${{ github.run_number }}
          body: "スマホでこのページを開き、下の .apk をタップしてインストールしてください。"
          files: out/*.apk
          make_latest: true
